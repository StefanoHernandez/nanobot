# Fork-only: nanobot mobile (React Native) checks.
name: mobile-ci

on:
  pull_request:
  push:
    branches: [main]
    paths: ["mobile/**", "webui/src/lib/**", "webui/packages/**", "packages/client-events/**", ".github/workflows/mobile-ci.yml"]
  workflow_dispatch:

jobs:
  test:
    if: github.repository == 'StefanoHernandez/nanobot'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx jest --ci
      # The app uses a frozen copy of the WebUI protocol code (mobile/vendor).
      # The fork tracks upstream main and mobile/vendor must be an exact copy of the same commit's
      # WebUI client: a mismatch means the app and the server speak different protocols. Hard fail.
      - name: Vendor matches server WebUI
        working-directory: .
        run: |
          bad=0
          for v in $(cd mobile/vendor/nanobot && find webui packages -type f); do
            if ! cmp -s "mobile/vendor/nanobot/$v" "$v"; then
              echo "::error file=mobile/vendor/nanobot/$v::differs from $v - run: bash mobile/scripts/sync-nanobot.sh ."
              bad=1
            fi
          done
          exit $bad
