# Fork-only: weekly merge of HKUDS/nanobot into a PR against our main.
name: upstream-sync

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    if: github.repository == 'StefanoHernandez/nanobot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge upstream into sync branch
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/HKUDS/nanobot.git
          git fetch upstream main
          if [ "$(git rev-list --count HEAD..upstream/main)" = "0" ]; then
            echo "changes=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "changes=true" >> "$GITHUB_OUTPUT"
          git checkout -B upstream-sync
          if git merge --no-edit upstream/main; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          else
            # keep the conflict visible in the PR instead of failing silently
            git merge --abort
            git reset --hard upstream/main
            echo "conflict=true" >> "$GITHUB_OUTPUT"
          fi
          git push -f origin upstream-sync
      - name: Open or update PR
        if: steps.merge.outputs.changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ steps.merge.outputs.conflict }}" = "true" ]; then
            title="Upstream sync (CONFLICTS: merge locally)"
            body="Automatic merge failed. Run locally: git fetch upstream && git merge upstream/main, resolve, push."
          else
            title="Upstream sync"
            body="Automatic merge of HKUDS/nanobot main. Review and merge."
          fi
          gh pr view upstream-sync >/dev/null 2>&1 \
            && gh pr edit upstream-sync --title "$title" --body "$body" \
            || gh pr create --head upstream-sync --base main --title "$title" --body "$body"
