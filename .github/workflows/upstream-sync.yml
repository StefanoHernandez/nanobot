# Fork-only: weekly merge of HKUDS/nanobot `main` into a PR against our main.
# We track upstream main (decided 2026-10-14): the app's mobile/vendor/ copy of the WebUI client
# must come from the SAME upstream commit as the server, so the sync re-copies it in the same PR.
name: upstream-sync

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    if: github.repository == 'StefanoHernandez/nanobot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge upstream main into sync branch
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/HKUDS/nanobot.git
          git fetch upstream main
          sha=$(git rev-parse upstream/main)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor "$sha" HEAD; then
            echo "changes=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "changes=true" >> "$GITHUB_OUTPUT"
          branch="upstream-sync/main"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          git checkout -B "$branch"
          if git merge --no-edit "$sha"; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
            # keep the app's vendored WebUI client on the same upstream commit
            bash mobile/scripts/sync-nanobot.sh .
            printf 'commit: %s\ndate: %s\n' "$sha" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > mobile/vendor/nanobot/VERSION
            git add mobile/vendor
            git commit -q -m "chore(mobile): re-sync vendor to upstream ${sha:0:8}" || true
          else
            # keep the conflict visible in the PR instead of failing silently
            git merge --abort
            git reset --hard "$sha"
            echo "conflict=true" >> "$GITHUB_OUTPUT"
          fi
          git push -f origin "$branch"
      # PRs opened with GITHUB_TOKEN don't trigger other workflows, so the app
      # checks (mobile-ci) run here and their result goes into the PR body.
      - uses: actions/setup-node@v4
        if: steps.merge.outputs.changes == 'true' && steps.merge.outputs.conflict == 'false'
        with:
          node-version: 22
      - name: App checks on the merged tree
        id: app
        if: steps.merge.outputs.changes == 'true' && steps.merge.outputs.conflict == 'false'
        continue-on-error: true
        working-directory: mobile
        run: npm ci && npx tsc --noEmit && npx jest --ci
      - name: Open or update PR
        if: steps.merge.outputs.changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha="${{ steps.merge.outputs.sha }}"; tag="main@${sha:0:8}"; branch="${{ steps.merge.outputs.branch }}"
          app="${{ steps.app.outcome }}"
          if [ "${{ steps.merge.outputs.conflict }}" = "true" ]; then
            title="Upstream $tag (CONFLICTS: merge locally)"
            body="Automatic merge failed. Locally: git fetch upstream && git merge $sha, resolve, then bash mobile/scripts/sync-nanobot.sh . (VERSION = $sha), run the app tests, push."
          else
            title="Upstream $tag (app checks: $app)"
            body="Automatic merge of HKUDS/nanobot main $sha, with mobile/vendor re-synced to the same commit. App typecheck+tests on the merged tree: **$app** (see the run log). A vendor change can break the app: fix it in src/platform or src/state before merging. After merge, build-arduino republishes branch arduino: reinstall on arduino."
          fi
          gh pr view "$branch" >/dev/null 2>&1 \
            && gh pr edit "$branch" --title "$title" --body "$body" \
            || gh pr create --head "$branch" --base main --title "$title" --body "$body"
