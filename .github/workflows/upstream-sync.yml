# Fork-only: weekly check for a new HKUDS/nanobot RELEASE (vX.Y.Z tag) and
# open a PR merging it into our main. We track releases, not upstream main.
name: upstream-sync

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    if: github.repository == 'StefanoHernandez/nanobot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge newest upstream release into sync branch
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/HKUDS/nanobot.git
          git fetch --tags upstream
          tag=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | grep -vE -- '-(rc|alpha|beta|dev)' | sort -V | tail -1)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ -z "$tag" ] || git merge-base --is-ancestor "$tag" HEAD; then
            echo "changes=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "changes=true" >> "$GITHUB_OUTPUT"
          branch="upstream-sync/$tag"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          git checkout -B "$branch"
          if git merge --no-edit "$tag"; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          else
            # keep the conflict visible in the PR instead of failing silently
            git merge --abort
            git reset --hard "$tag"
            echo "conflict=true" >> "$GITHUB_OUTPUT"
          fi
          git push -f origin "$branch"
      # PRs opened with GITHUB_TOKEN don't trigger other workflows, so the app
      # checks (mobile-ci) run here and their result goes into the PR body.
      - uses: actions/setup-node@v4
        if: steps.merge.outputs.changes == 'true' && steps.merge.outputs.conflict == 'false'
        with:
          node-version: 22
      - name: App checks on the merged tree
        id: app
        if: steps.merge.outputs.changes == 'true' && steps.merge.outputs.conflict == 'false'
        continue-on-error: true
        working-directory: mobile
        run: npm ci && npx tsc --noEmit && npx jest --ci
      - name: Open or update PR
        if: steps.merge.outputs.changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.merge.outputs.tag }}"; branch="${{ steps.merge.outputs.branch }}"
          app="${{ steps.app.outcome }}"
          if [ "${{ steps.merge.outputs.conflict }}" = "true" ]; then
            title="Upstream release $tag (CONFLICTS: merge locally)"
            body="Automatic merge failed. Locally: git fetch --tags upstream && git merge $tag, resolve, push. Check the mobile-ci result and vendor drift warnings."
          else
            title="Upstream release $tag (app checks: $app)"
            body="Automatic merge of HKUDS/nanobot $tag. App typecheck+tests on the merged tree: **$app** (see the run log). Also run mobile-ci manually for the vendor drift report before merging, then reinstall on luffy."
          fi
          gh pr view "$branch" >/dev/null 2>&1 \
            && gh pr edit "$branch" --title "$title" --body "$body" \
            || gh pr create --head "$branch" --base main --title "$title" --body "$body"
